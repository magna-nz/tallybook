<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Tallybook</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Crect x='2' y='2' width='22' height='22' rx='4' fill='%236b4fa8'/%3E%3Cpath d='M7 8h12M7 13h12M7 18h7' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* Three palettes over one set of token names. Embigo is the default, the bare
   :root: ShipPromptly's warm-neutral surface ramp (paper under a lamp rather
   than a screen in a dark room) with its indigo-to-violet brand, every value
   taken from forgehub-pro's index.css. Ledger light and Ledger dark are the
   page's own earlier palettes, attribute-scoped. A picker in the scope bar
   sets data-theme and the browser remembers it. */
:root {
  color-scheme: dark;
  --bg: #1e1d1b; --surface: #262523; --surface-2: #302e2b; --surface-3: #3a3835;
  --line: #3a3733; --line-strong: #55504a;
  --ink: #f2efe9; --ink-2: #a29c91; --ink-3: #7b756a;
  --accent: #9a8ad4; --accent-ink: #ffffff; --accent-line: #6b4fa8;
  --accent-soft: linear-gradient(135deg, rgba(95, 99, 196, 0.16), rgba(107, 79, 168, 0.16));
  --brand: linear-gradient(135deg, #5f63c4 0%, #6b4fa8 100%);
  --brand-shadow: 0 5px 18px rgba(107, 79, 168, 0.28);
  --mark: #6b4fa8;
  --s1: #8195cf; --s2: #d98aa5;
  --seq-1: #34355c; --seq-4: #8195cf;
  --good: #89c360; --good-soft: rgba(137, 195, 96, 0.16);
  --warn: #f1ae27; --warn-soft: rgba(241, 174, 39, 0.16);
  --crit: #e75140; --crit-soft: rgba(231, 81, 64, 0.16);
  --code-bg: #191817;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f3f5f4; --surface: #ffffff; --surface-2: #e9edeb; --surface-3: #dfe5e2;
  --line: #d5dbd8; --line-strong: #b9c2bd;
  --ink: #16201c; --ink-2: #4d5a55; --ink-3: #78847f;
  --accent: #1d6b59; --accent-ink: #ffffff; --accent-line: #a9d3c5; --accent-soft: #dcefe8;
  --brand: #1d6b59; --brand-shadow: none; --mark: #1d6b59;
  --s1: #2a78d6; --s2: #eb6834;
  --seq-1: #cde2fb; --seq-4: #3987e5;
  --good: #0ca30c; --good-soft: #e3f4e3; --warn: #9a6b00; --warn-soft: #fbf0d2; --crit: #d03b3b; --crit-soft: #fbe3e3;
  --code-bg: #eef2f0;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #141917; --surface: #1b211e; --surface-2: #232b27; --surface-3: #2c3630;
  --line: #2f3934; --line-strong: #46534d;
  --ink: #eef2f0; --ink-2: #b3bdb8; --ink-3: #7f8a85;
  --accent: #3fa88f; --accent-ink: #0e1a16; --accent-line: #2f5f52; --accent-soft: #1f3a32;
  --brand: #3fa88f; --brand-shadow: none; --mark: #3fa88f;
  --s1: #3987e5; --s2: #d95926; --seq-1: #184f95; --seq-4: #3987e5;
  --good: #2fbf2f; --good-soft: #1b2e1b; --warn: #fab219; --warn-soft: #3a2f10; --crit: #e66767; --crit-soft: #3a1f1f;
  --code-bg: #101512;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); }
a { color: var(--accent); }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, .mono { font-family: var(--mono); font-size: .92em; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
h1 { font-size: 20px; }
h2 { font-size: 15px; }
h3 { font-size: 13px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .06em; font-weight: 500; }
p { margin: 0; }

.app { display: grid; grid-template-columns: 196px 1fr; min-height: 100vh; }
.rail { background: var(--surface); border-right: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.brand svg { width: 26px; height: 26px; flex: none; }
.brand svg rect { fill: var(--mark); }
.brand b { font-weight: 600; font-size: 15px; }
.brand small { display: block; color: var(--ink-3); font-size: 11px; font-family: var(--mono); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav h3 { padding: 10px 8px 4px; font-size: 11px; }
.nav a { display: block; padding: 6px 8px; border-radius: 6px; color: var(--ink); text-decoration: none; }
.nav a:hover { background: var(--surface-2); }
.nav a.active { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.rail-foot { margin-top: auto; font-size: 12px; color: var(--ink-3); padding: 0 8px; line-height: 1.45; }

.main { min-width: 0; display: flex; flex-direction: column; }
.scope { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px 24px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.scope label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
.scope select, .scope input { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 6px; padding: 4px 8px; font-size: 13px; max-width: 260px; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 4px 10px; font-size: 13px; cursor: pointer; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.fresh { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--ink-3); }
.fresh .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); display: inline-block; margin-right: 6px; }
.fresh .dot.stale { background: var(--warn); }
.fresh .dot.err { background: var(--crit); }
.btn { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 6px; padding: 4px 10px; font-size: 13px; cursor: pointer; color: var(--ink); }
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--brand); color: var(--accent-ink); border-color: transparent; box-shadow: var(--brand-shadow); }
.btn.small { padding: 2px 8px; font-size: 12px; }

.view { padding: 22px 24px 60px; max-width: 1180px; width: 100%; }
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.page-head .sub { color: var(--ink-2); margin-top: 2px; }
.cli { display: flex; align-items: center; gap: 8px; }
.cli code { background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }

.grid { display: grid; gap: 16px; }
.cols-2 { grid-template-columns: 1fr 1fr; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; min-width: 0; }
.panel > h3 { margin-bottom: 10px; }
.section { margin-top: 26px; }
.section > h2 { margin-bottom: 10px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.section > h2 small { color: var(--ink-3); font-weight: 400; font-size: 12px; }
.note { color: var(--ink-3); font-size: 12px; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.tile .k { font-size: 12px; color: var(--ink-2); }
.tile .v { font-size: 22px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
.tile .v small { font-size: 12px; font-weight: 400; color: var(--ink-3); margin-left: 4px; }
.tile .d { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.up { color: var(--crit); } .down { color: var(--good); } .flat { color: var(--ink-3); }

table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); font-weight: 500; white-space: nowrap; }
td.r, th.r { text-align: right; }
td.num { white-space: nowrap; }
tr.row:hover td { background: var(--surface-2); }
tr.clickable { cursor: pointer; }
.tbl { overflow-x: auto; }
tbody tr:last-child td { border-bottom: 0; }
td .sub { display: block; font-size: 11px; color: var(--ink-3); }

.pill { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--ink-2); line-height: 1.5; white-space: nowrap; }
.pill.good { background: var(--good-soft); border-color: transparent; color: var(--good); }
.pill.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.pill.crit { background: var(--crit-soft); border-color: transparent; color: var(--crit); }
.pill.accent { background: var(--accent-soft); border-color: transparent; color: var(--accent); }

pre { margin: 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; font: 12px/1.5 var(--mono); overflow-x: auto; color: var(--ink); white-space: pre; }
pre.json { max-height: 70vh; overflow: auto; }
.diff .add { color: var(--good); } .diff .del { color: var(--crit); } .diff .hdr { color: var(--ink-3); }

.findings-list { display: flex; flex-direction: column; }
.finding-row { display: grid; grid-template-columns: 36px 84px 1fr auto; gap: 12px; align-items: baseline; padding: 10px 6px; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; border-radius: 6px; }
.finding-row:last-child { border-bottom: 0; }
.finding-row:hover { background: var(--surface-2); }
.finding-row .n { color: var(--ink-3); font-family: var(--mono); font-size: 12px; }
.finding-row .share { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 600; font-size: 15px; }
.finding-row .share small { display: block; font-weight: 400; font-size: 11px; color: var(--ink-3); }
.finding-row .t { font-weight: 500; }
.finding-row .chips { display: flex; gap: 6px; }
.prose { max-width: 68ch; }
.prose p + p { margin-top: 10px; }
.prose ul { margin: 8px 0 0; padding-left: 20px; }
.four { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.four .panel h3 { margin-bottom: 8px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; font-size: 13px; margin: 0; }
.kv dt { color: var(--ink-2); } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

.bars { display: flex; flex-direction: column; gap: 7px; }
.bar { display: grid; grid-template-columns: 170px 1fr 70px; gap: 10px; align-items: center; font-size: 13px; }
.bar .lab { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--mono); font-size: 12px; }
.bar .track { height: 12px; background: var(--surface-2); border-radius: 3px; overflow: hidden; display: block; }
.bar .fill { height: 100%; border-radius: 0 3px 3px 0; background: var(--seq-4); display: block; }
.bar .val { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.split { height: 14px; display: flex; border-radius: 4px; overflow: hidden; gap: 2px; }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--ink-2); margin-top: 8px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font: 12px/1.4 var(--mono); padding: 5px 8px; border-radius: 5px; white-space: nowrap; transform: translate(-50%, -110%); display: none; z-index: 3; }
.tip.show { display: block; }

.change { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 14px 16px; }
.change .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.change .head .arrow { color: var(--ink-3); }
.change .sides { display: grid; grid-template-columns: 60px repeat(4, 1fr); gap: 4px 12px; font-size: 13px; font-variant-numeric: tabular-nums; }
.change .sides .h { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; }
.toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.toolbar input[type="number"] { width: 60px; padding: 3px 6px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); }
.toolbar label { display: flex; align-items: center; gap: 6px; }

.banner { border-radius: 6px; padding: 8px 12px; font-size: 13px; margin-bottom: 16px; }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.banner.crit { background: var(--crit-soft); color: var(--crit); }
.empty { padding: 30px; text-align: center; color: var(--ink-3); }
.turn-note { color: var(--warn); } .turn-note.rebuild { color: var(--crit); }
.subagent-line td { background: var(--surface-2); font-size: 12px; color: var(--ink-2); }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10; }
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .rail { position: static; height: auto; flex-direction: row; flex-wrap: wrap; }
  .rail-foot { display: none; }
  .tiles, .cols-2, .four { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <svg viewBox="0 0 26 26" aria-hidden="true"><rect x="2" y="2" width="22" height="22" rx="4"/><path d="M7 8h12M7 13h12M7 18h7" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/></svg>
      <div><b>Tallybook</b><small id="brand-host"></small></div>
    </div>
    <nav class="nav" id="nav">
      <h3>Report</h3>
      <a href="#/report" data-route="report">Overview</a>
      <a href="#/findings" data-route="findings">Findings</a>
      <a href="#/agents" data-route="agents">Sub-agents</a>
      <a href="#/sessions" data-route="sessions">Sessions</a>
      <a href="#/changes" data-route="changes">Model changes</a>
      <h3>Setup</h3>
      <a href="#/status" data-route="status">Status</a>
      <a href="#/prices" data-route="prices">Prices</a>
      <a href="#/config" data-route="config">Config &amp; hook</a>
    </nav>
    <div class="rail-foot" id="rail-foot">Nothing leaves your machine. This page talks only to the tallybook process that opened it.</div>
  </aside>
  <div class="main">
    <header class="scope" id="scope"></header>
    <main class="view" id="view"></main>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* State mirrors the CLI's global flags. Empty currency means the detected plan. */
const S = { since: '', project: '', source: '', currency: '', compare: false, json: false, sort: 'time', limit: 20, minRuns: 3, undecided: false };
let projects = [];      // project paths seen in the ledger, for the picker
let fresh = null;       // {ingested_at, age_seconds, scan_error} from the last response
let defaults = { since: '30d', plan: '' };
let seq = 0;            // render sequence, so a slow response cannot paint over a newer view

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const usd = n => { n = Number(n) || 0; return n > 0 && n < 0.01 ? '$' + n.toFixed(4) : '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
const pct = x => { x = Number(x) || 0; return (x * 100 < 1 && x > 0 ? '<1' : Math.round(x * 100)) + '%'; };
const int = n => (Number(n) || 0).toLocaleString('en-US');
const shortId = id => { if (!id) return ''; const [p, a] = id.split('/agent-'); return a ? p.slice(0, 8) + '/' + a.slice(0, 6) : id.slice(0, 8); };
const sid = id => esc(shortId(id)); // for templates: ids come from transcripts, so they are data
const home = () => (S.home || '');
const tilde = p => { if (!p) return ''; const h = home(); return h && p.startsWith(h) ? '~' + p.slice(h.length) : p; };
const projLabel = p => { if (!p) return ''; const i = p.indexOf('/.claude/worktrees/'); if (i > -1) return p.slice(0, i).split(/[\\/]/).pop() + ' (worktree)'; return p.split(/[\\/]/).pop(); };
const fmtDT = d => d ? new Date(d).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }) : '';
const fmtT = d => d ? new Date(d).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }) : '';
const fmtDate = d => d ? new Date(d).toLocaleDateString('en-US', { day: 'numeric', month: 'short' }) : '';
const srcLabel = s => s === 'claude-code' ? 'Claude Code' : s === 'codex' ? 'Codex' : esc(s);
const dirLabel = d => ({ downgrade: 'Move work to a cheaper model', context: 'Shrink what is sent every turn', cache: 'Keep the prompt cache warm', effort: 'Lower thinking effort', config: 'A setting is not doing what you think', upgrade: 'Needs a stronger model or a better brief' }[d] || 'Other');
const confPill = c => c === 'info' ? '<span class="pill">info</span>' : `<span class="pill ${c === 'high' ? 'good' : c === 'medium' ? 'accent' : ''}">${esc(c)} confidence</span>`;
const md = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const paras = s => String(s || '').split(/\n\s*\n/).map(p => `<p>${md(p).replace(/\n/g, '<br>')}</p>`).join('');
let sub = false;        // true when the response said list_price_equivalent
const moneyHead = () => sub ? 'list-price equiv.' : 'bill';

function scopeParams() {
  const p = new URLSearchParams();
  if (S.since) p.set('since', S.since);
  if (S.project) p.set('project', S.project);
  if (S.source) p.set('source', S.source);
  if (S.currency) p.set('currency', S.currency);
  return p;
}
function cli(extra) {
  const f = [];
  if (S.since && S.since !== defaults.since) f.push('--since ' + S.since);
  if (S.project) f.push('--project ' + tilde(S.project));
  if (S.source === 'claude-code') f.push('--claude'); if (S.source === 'codex') f.push('--codex');
  if (S.currency) f.push('--currency ' + S.currency);
  if (S.json) f.push('--json');
  return ['tallybook', ...f, ...(extra || [])].join(' ');
}
async function api(path, params, opts) {
  const qs = params && [...params].length ? '?' + params.toString() : '';
  const res = await fetch('/api/' + path + qs, opts);
  let body = null;
  try { body = await res.json(); } catch (e) { body = null; }
  if (!res.ok) { const e = new Error(body && body.error ? body.error : `${res.status} ${res.statusText}`); e.status = res.status; throw e; }
  if (body && typeof body === 'object' && 'ingested_at' in body) fresh = { ingested_at: body.ingested_at, age_seconds: body.age_seconds, scan_error: body.scan_error || '' };
  if (body && body.currency) sub = body.currency === 'list_price_equivalent';
  return body;
}
async function post(path) {
  return api(path, null, { method: 'POST', headers: { 'X-Tallybook-Request': '1' } });
}

/* ---- theme ---- */
const THEMES = ['embigo', 'light', 'dark'];
// The bare :root is Embigo, so the default is written out explicitly rather
// than by removing the attribute: an attribute that is always present can be
// read back by a test or a person with dev tools open.
function theme() { const t = document.documentElement.getAttribute('data-theme'); return THEMES.includes(t) ? t : 'embigo'; }
function setTheme(t) { if (!THEMES.includes(t)) t = 'embigo'; document.documentElement.setAttribute('data-theme', t); try { localStorage.setItem('tb-theme', t); } catch (e) {} }

/* ---- scope bar ---- */
function renderScope() {
  const el = document.getElementById('scope');
  const since = S.since || defaults.since;
  const custom = /^\d{4}-\d{2}-\d{2}$/.test(since);
  // A worktree's project path sits under its repository's, so every repo
  // with worktrees also gets a prefix option (trailing slash, like --project
  // on the CLI) that covers the repo and all of them.
  const roots = new Map();
  for (const p of projects) { const i = p.indexOf('/.claude/worktrees/'); const root = i > -1 ? p.slice(0, i) : p; if (!roots.has(root)) roots.set(root, new Set()); roots.get(root).add(p); }
  const opts = [...roots.keys()].sort().map(root => {
    const members = [...roots.get(root)].sort();
    const own = members.filter(p => p === root), wts = members.filter(p => p !== root);
    let h = '';
    if (wts.length) h += `<option value="${esc(root)}/" ${S.project === root + '/' ? 'selected' : ''}>${esc(tilde(root))}/ (with ${wts.length} worktree${wts.length > 1 ? 's' : ''})</option>`;
    for (const p of own.concat(wts)) h += `<option value="${esc(p)}" ${S.project === p ? 'selected' : ''}>${wts.length ? '\u00a0\u00a0' : ''}${esc(tilde(p))}</option>`;
    return h;
  }).join('');
  el.innerHTML = `
    <label>Window
      <select id="f-since">
        ${['7d', '30d', '90d', 'all'].map(v => `<option value="${v}" ${since === v ? 'selected' : ''}>${v === 'all' ? 'All time' : 'Last ' + v.replace('d', ' days')}</option>`).join('')}
        <option value="date" ${custom ? 'selected' : ''}>Since a date…</option>
      </select>
      <input type="date" id="f-date" value="${custom ? since : ''}" ${custom ? '' : 'hidden'}>
    </label>
    <label>Project
      <select id="f-project"><option value="">Every project</option>${opts}</select>
    </label>
    <label>Source
      <span class="seg" id="f-source">${[['', 'Both'], ['claude-code', 'Claude Code'], ['codex', 'Codex']].map(([v, l]) => `<button data-v="${v}" class="${S.source === v ? 'on' : ''}">${l}</button>`).join('')}</span>
    </label>
    <label>Currency
      <span class="seg" id="f-currency">${[['', 'Plan'], ['share', 'Share'], ['usd', 'USD']].map(([v, l]) => `<button data-v="${v}" class="${S.currency === v ? 'on' : ''}" title="${v ? '' : 'as detected: ' + esc(defaults.plan)}">${l}</button>`).join('')}</span>
    </label>
    <div class="fresh">
      <span id="fresh-text">${freshText()}</span>
      <button class="btn small" id="f-refresh">Rescan</button>
      <select id="f-theme" title="Theme">${[['embigo', 'Embigo'], ['light', 'Ledger light'], ['dark', 'Ledger dark']].map(([v, l]) => `<option value="${v}" ${theme() === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
    </div>`;
  el.querySelector('#f-since').onchange = e => { if (e.target.value === 'date') { el.querySelector('#f-date').hidden = false; el.querySelector('#f-date').focus(); return; } S.since = e.target.value; render(); };
  el.querySelector('#f-date').onchange = e => { if (e.target.value) { S.since = e.target.value; render(); } };
  el.querySelector('#f-project').onchange = e => { S.project = e.target.value; render(); };
  el.querySelectorAll('#f-source button').forEach(b => b.onclick = () => { S.source = b.dataset.v; render(); });
  el.querySelectorAll('#f-currency button').forEach(b => b.onclick = () => { S.currency = b.dataset.v; render(); });
  el.querySelector('#f-refresh').onclick = refresh;
  el.querySelector('#f-theme').onchange = e => setTheme(e.target.value);
}
function freshText() {
  if (!fresh) return '<span class="dot"></span>Not scanned yet';
  if (!fresh.ingested_at) return `<span class="dot err"></span>Scan failed${fresh.scan_error ? ': ' + esc(fresh.scan_error) : ''}`;
  const s = Number(fresh.age_seconds) || 0; const age = s < 60 ? 'just now' : s < 3600 ? Math.round(s / 60) + ' min ago' : Math.round(s / 3600) + ' h ago';
  return `<span class="dot ${fresh.scan_error ? 'err' : s > 3600 ? 'stale' : ''}"></span>Scanned ${age}${fresh.scan_error ? ' · last attempt failed' : ''}`;
}
async function refresh() {
  const b = document.getElementById('f-refresh'); if (b) { b.disabled = true; b.textContent = 'Scanning…'; }
  try { const r = await post('refresh'); toast(`Scanned ${int(r.scanned)} files in ${int(r.elapsed_ms)} ms: ${int(r.ingested)} new or changed, ${int(r.unchanged)} unchanged, ${int(r.failed)} failed.`); render(); }
  catch (e) { toast('Rescan failed: ' + e.message); if (b) { b.disabled = false; b.textContent = 'Rescan'; } }
}

/* ---- page chrome ---- */
function pageHead(title, subtitle, cmd, data) {
  return `<div class="page-head">
    <div><h1>${title}</h1>${subtitle ? `<p class="sub">${subtitle}</p>` : ''}</div>
    <div class="cli"><code>${esc(cmd)}</code><button class="btn small" data-copy="${esc(cmd)}">Copy</button><button class="btn small ${S.json ? 'primary' : ''}" id="json-toggle">${S.json ? 'View' : 'JSON'}</button></div>
  </div>` + (S.json ? `<pre class="json">${esc(JSON.stringify(data, null, 2))}</pre>` : '');
}
function delta(before, now, pts) {
  before = Number(before) || 0; now = Number(now) || 0;
  if (before === 0 && now === 0) return '<span class="flat">no change</span>';
  if (before === 0) return '<span class="up">new</span>';
  if (pts) { const d = (now - before) * 100; return Math.abs(d) < 1 ? '<span class="flat">about the same</span>' : `<span class="${d < 0 ? 'up' : 'down'}">${d > 0 ? 'up' : 'down'} ${Math.abs(d).toFixed(0)} pts</span>`; }
  const r = (now - before) / before; if (Math.abs(r) < 0.01) return '<span class="flat">about the same</span>';
  return `<span class="${r > 0 ? 'up' : 'down'}">${r > 0 ? 'up' : 'down'} ${Math.abs(Math.round(r * 100))}%</span>`;
}
function findingRow(f, n) {
  return `<a class="finding-row" href="#/finding/${esc(f.id)}">
    <span class="n">${n}.</span>
    <span class="share">${f.confidence === 'info' ? '<span class="note">--</span>' : (sub ? pct(f.share) : usd(f.saving_usd))}<small>${f.confidence === 'info' ? 'no saving' : sub ? usd(f.saving_usd) + ' / mo' : pct(f.share) + ' of window'}</small></span>
    <span><span class="t">${esc(f.title)}</span></span>
    <span class="chips">${confPill(f.confidence)}<span class="pill">${esc(f.direction)}</span></span>
  </a>`;
}
function scanNote(d) { return d.skipped_files ? `<div class="banner warn">${int(d.skipped_files)} transcript file${d.skipped_files > 1 ? 's' : ''} could not be parsed and are not counted. See <a href="#/status">Status</a>.</div>` : ''; }

/* ---- screens; each returns HTML and may return a function to run after paint ---- */
const V = {};

V.report = async () => {
  const bounded = (S.since || defaults.since) !== 'all';
  const p = scopeParams(); if (S.compare && bounded) p.set('compare', '1');
  const d = await api('report', p);
  let h = pageHead('Overview', `Scanned ${int(d.sessions)} sessions, ${int(d.subagents)} sub-agent runs (${esc(d.window.label)})`, cli(S.compare ? ['--compare'] : []), d);
  if (S.json) return h;
  h += scanNote(d);
  const pr = d.prior;
  if (!d.sessions && !d.subagents) return h + '<div class="panel empty">No sessions in this window.</div>';
  h += `<div class="tiles">
    <div class="tile"><div class="k">Total · ${moneyHead()}</div><div class="v">${sub ? '100%' : usd(d.usd)}${sub ? `<small>${usd(d.usd)}</small>` : ''}</div><div class="d">${pr ? `${delta(pr.usd, d.usd)} · ${usd(pr.usd)} before` : `${int(d.turns)} turns`}</div></div>
    <div class="tile"><div class="k">Main session turns</div><div class="v">${sub ? pct(d.usd ? d.main_usd / d.usd : 0) : usd(d.main_usd)}${sub ? `<small>${usd(d.main_usd)}</small>` : ''}</div><div class="d">${pr ? `${delta(pr.main_usd, d.main_usd)} · ${usd(pr.main_usd)} before` : `${int(d.sessions)} sessions`}</div></div>
    <div class="tile"><div class="k">Sub-agents</div><div class="v">${sub ? pct(d.usd ? d.subagent_usd / d.usd : 0) : usd(d.subagent_usd)}${sub ? `<small>${usd(d.subagent_usd)}</small>` : ''}</div><div class="d">${pr ? `${delta(pr.subagent_usd, d.subagent_usd)} · ${usd(pr.subagent_usd)} before` : `${int(d.subagents)} runs`}</div></div>
    <div class="tile"><div class="k">Cache hit rate</div><div class="v">${Math.round(d.cache_hit_rate * 100)}%</div><div class="d">${pr ? `${delta(pr.cache_hit_rate, d.cache_hit_rate, true)} · ${Math.round(pr.cache_hit_rate * 100)}% before` : 'read back from the prompt cache'}</div></div>
  </div>
  ${sub ? '<p class="note" style="margin-top:8px">You are on a subscription: dollars are what this usage would cost on the API, not what you paid. Share is the number to watch.</p>' : ''}`;

  // Spend over time, from the report's by_day series: every row's cost on
  // the day it started. Past about six months of days the bars would be
  // hairlines, so the series is folded into weeks instead of being cut.
  let after = null;
  if (d.by_day && d.by_day.length) {
    const byDay = new Map(d.by_day.map(x => [x.date, x.usd]));
    const dayOf = k => { const [y, m, dd] = k.split('-').map(Number); return new Date(y, m - 1, dd); };
    const keyOf = t => `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;
    let start = d.window.since ? dayOf(d.window.since.slice(0, 10)) : dayOf(d.by_day[0].date);
    const end = dayOf(d.window.until.slice(0, 10));
    const span = Math.round((end - start) / 86400000) + 1;
    const step = span > 200 ? 7 : 1;
    if (step === 7) { start = new Date(end); start.setDate(end.getDate() - 7 * Math.ceil(span / 7) + 1); }
    const days = [];
    for (let t = new Date(start); t <= end; t.setDate(t.getDate() + step)) {
      let usd = 0; for (let i = 0; i < step; i++) { const u = new Date(t); u.setDate(t.getDate() + i); usd += byDay.get(keyOf(u)) || 0; }
      days.push({ date: new Date(t), usd });
    }
    const maxDay = Math.max(...days.map(x => x.usd), 0.01);
    const W = 900, H = 150, padL = 48, padB = 22, bw = (W - padL - 8) / days.length;
    const labelEvery = days.length <= 10 ? 1 : days.length <= 40 ? 7 : days.length <= 120 ? 14 : 30;
    const ticks = [0, maxDay / 2, maxDay];
    h += `<div class="section"><h2>Spend by ${step === 7 ? 'week' : 'day'} <small>by the day each session started · hover a bar</small></h2><div class="panel">
      <div class="chart" id="daychart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Spend per day">
        ${ticks.map(v => { const y = H - padB - (v / maxDay) * (H - padB - 10); return `<line x1="${padL}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${padL - 6}" y="${y + 4}" text-anchor="end" font-size="10" fill="var(--ink-3)" font-family="var(--mono)">$${Math.round(v)}</text>`; }).join('')}
        ${days.map((x, i) => { const hgt = (x.usd / maxDay) * (H - padB - 10); return `<rect data-i="${i}" x="${padL + i * bw + 1}" y="${H - padB - hgt}" width="${Math.max(bw - 2, 1.5)}" height="${hgt}" rx="${bw > 6 ? 2 : 0}" fill="var(--seq-4)"/>`; }).join('')}
        ${days.map((x, i) => i % labelEvery === 0 ? `<text x="${padL + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--ink-3)">${x.date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</text>` : '').join('')}
      </svg><div class="tip" id="daytip"></div></div>
      <div class="split" style="margin-top:14px"><div style="width:${d.usd ? d.main_usd / d.usd * 100 : 0}%;background:var(--s1)"></div><div style="width:${d.usd ? d.subagent_usd / d.usd * 100 : 0}%;background:var(--s2)"></div></div>
      <div class="legend"><span><i style="background:var(--s1)"></i>Main session turns ${pct(d.usd ? d.main_usd / d.usd : 0)}</span><span><i style="background:var(--s2)"></i>Sub-agents ${pct(d.usd ? d.subagent_usd / d.usd : 0)}</span></div>
    </div></div>`;
    after = () => {
      const c = document.getElementById('daychart'); if (!c) return; const tip = document.getElementById('daytip');
      c.querySelectorAll('rect').forEach(r => { r.addEventListener('mouseenter', () => { const x = days[+r.dataset.i]; tip.textContent = `${step === 7 ? 'week of ' : ''}${x.date.toLocaleDateString('en-US', { weekday: step === 7 ? undefined : 'short', month: 'short', day: 'numeric' })}  ${usd(x.usd)}`; const rb = r.getBoundingClientRect(), cb = c.getBoundingClientRect(); tip.style.left = (rb.left - cb.left + rb.width / 2) + 'px'; tip.style.top = (rb.top - cb.top) + 'px'; tip.classList.add('show'); }); r.addEventListener('mouseleave', () => tip.classList.remove('show')); });
    };
  }

  const models = Object.entries(d.by_model || {}).sort((a, b) => b[1] - a[1]); const maxM = models.length ? models[0][1] : 1;
  const unknown = Object.entries(d.unknown_models || {});
  h += `<div class="grid cols-2 section">
    <div class="panel"><h3>By model</h3><div class="bars">${models.map(([m, v]) => `<div class="bar"><span class="lab" title="${esc(m)}">${esc(m)}</span><span class="track"><span class="fill" style="width:${maxM ? v / maxM * 100 : 0}%"></span></span><span class="val">${sub ? pct(d.usd ? v / d.usd : 0) : usd(v)}</span></div>`).join('') || '<p class="note">No priced turns.</p>'}</div>
      ${unknown.length ? `<p class="note" style="margin-top:10px">Unpriced, counted as $0: ${unknown.map(([m, n]) => `<code>${esc(m)}</code> (${int(n)} turn${n === 1 ? '' : 's'})`).join(', ')}.</p>` : ''}</div>
    <div class="panel"><h3>By source</h3><div class="tbl"><table><thead><tr><th>Source</th><th class="r">Sessions</th><th class="r">Turns</th><th class="r">${sub ? 'Share' : 'Cost'}</th></tr></thead><tbody>
      ${Object.entries(d.by_source || {}).map(([s, v]) => `<tr><td>${srcLabel(s)}</td><td class="r num">${int(v.sessions)}</td><td class="r num">${int(v.turns)}</td><td class="r num">${sub ? pct(d.usd ? v.usd / d.usd : 0) : usd(v.usd)}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="toolbar" style="margin:14px 0 0"><label><input type="checkbox" id="cmp" ${S.compare ? 'checked' : ''} ${(S.since || defaults.since) === 'all' ? 'disabled' : ''}> Compare with the ${Math.round(d.window.days)} days before${(S.since || defaults.since) === 'all' ? ' (needs a bounded window)' : ''}</label></div>
    ${pr ? (pr.sessions || pr.subagents ? `<div class="tbl" style="margin-top:8px"><table><thead><tr><th>${esc(pr.window.label)}</th><th class="r">Before</th><th class="r">Now</th><th class="r">Move</th></tr></thead><tbody>
      <tr><td>Sessions</td><td class="r num">${int(pr.sessions)}</td><td class="r num">${int(d.sessions)}</td><td class="r">${delta(pr.sessions, d.sessions)}</td></tr>
      <tr><td>Sub-agent runs</td><td class="r num">${int(pr.subagents)}</td><td class="r num">${int(d.subagents)}</td><td class="r">${delta(pr.subagents, d.subagents)}</td></tr>
      <tr><td>Total</td><td class="r num">${usd(pr.usd)}</td><td class="r num">${usd(d.usd)}</td><td class="r">${delta(pr.usd, d.usd)}</td></tr>
    </tbody></table></div>` : `<p class="note" style="margin-top:8px">Nothing was recorded in the ${Math.round(pr.window.days)} days before (${esc(pr.window.label)}), so there is nothing to compare with.</p>`) : ''}
    </div>
  </div>`;

  const fs = d.findings || [];
  const priced = fs.map((f, i) => ({ f, n: i + 1 })).filter(x => x.f.confidence !== 'info');
  const info = fs.map((f, i) => ({ f, n: i + 1 })).filter(x => x.f.confidence === 'info');
  const top = priced.slice(0, 5), notes = info.slice(0, 2);
  const rest = fs.length - top.length - notes.length;
  h += `<div class="section"><h2>Top findings <small>estimated saving / month · savings overlap and do not add up</small></h2><div class="panel findings-list">
    ${top.map(x => findingRow(x.f, x.n)).join('')}
    ${notes.length ? `<h3 style="padding:14px 6px 4px">Also worth knowing</h3>${notes.map(x => findingRow(x.f, x.n)).join('')}` : ''}
    ${!fs.length ? '<p class="empty">No findings: nothing crossed its evidence floor in this window.</p>' : ''}
    ${rest > 0 ? `<p class="note" style="padding:12px 6px 4px">${rest} more finding${rest > 1 ? 's' : ''}. <a href="#/findings">See every finding</a>.</p>` : ''}
  </div></div>`;
  return [h, () => { if (after) after(); const c = document.getElementById('cmp'); if (c) c.onchange = () => { S.compare = c.checked; render(); }; }];
};

V.findings = async () => {
  const d = await api('report', scopeParams());
  const fs = (d.findings || []).map((f, i) => ({ f, n: i + 1 }));
  let h = pageHead('Findings', 'Every finding in this window, grouped by the kind of change it asks for. Numbers match the overview and <code>tallybook finding &lt;n&gt;</code>.', cli(['findings']), { findings: d.findings });
  if (S.json) return h;
  h += scanNote(d);
  if (!fs.length) return h + '<div class="panel empty">No findings in this window. Nothing stood out as overpaid.</div>';
  const order = ['downgrade', 'context', 'cache', 'effort', 'config', 'upgrade'];
  const other = fs.filter(x => !order.includes(x.f.direction));
  h += order.map(dir => { const rows = fs.filter(x => x.f.direction === dir); if (!rows.length) return ''; return `<div class="section"><h2>${dirLabel(dir)}</h2><div class="panel findings-list">${rows.map(x => findingRow(x.f, x.n)).join('')}</div></div>`; }).join('');
  if (other.length) h += `<div class="section"><h2>Other</h2><div class="panel findings-list">${other.map(x => findingRow(x.f, x.n)).join('')}</div></div>`;
  h += '<p class="note" style="margin-top:20px">Every rule has a floor below which it says nothing; a short list means nothing crossed a floor, not that nothing was checked.</p>';
  return h;
};

  const isInfo = f.confidence === 'info';
  let h = pageHead(`${n ? n + '. ' : ''}${esc(f.title)}`, isInfo ? 'Info: a pointer rather than a saving.' : `${sub ? 'frees about <b>' + pct(f.share) + '</b> of your usage' : 'saves about <b>' + usd(f.saving_usd) + '</b> a month'} · ${sub ? usd(f.saving_usd) + ' list-price equiv.' : pct(f.share) + ' of the window'} · ${esc(f.confidence)} confidence`, cli(['finding', String(n || id), '--evidence']), f);
  if (S.json) return h;
  h += `<div style="display:flex;gap:8px;margin:-6px 0 16px;flex-wrap:wrap"><span class="pill">${esc(f.direction)}: ${dirLabel(f.direction)}</span><span class="pill mono">${esc(f.id)}</span></div>

    <div class="toolbar"><button class="btn primary small" data-copy="${esc(f.patch)}">Copy diff</button><span class="note">then <code>git apply</code> · CLI: <code>tallybook finding ${n || ''} --patch | git apply</code></span></div>
    <pre class="diff">${f.patch.split('\n').map(l => `<span class="${l.startsWith('+') && !l.startsWith('+++') ? 'add' : l.startsWith('-') && !l.startsWith('---') ? 'del' : /^(@@|---|\+\+\+)/.test(l) ? 'hdr' : ''}">${esc(l)}</span>`).join('\n')}</pre></div>`;

    <div class="panel tbl"><table><thead><tr>${ev.columns.map((c, i) => `<th class="${i > 1 ? 'r' : ''}">${esc(c)}</th>`).join('')}</tr></thead><tbody>
    ${ev.rows.map(r => `<tr class="row">${r.map((c, i) => { const col = (ev.columns[i] || '').toLowerCase(); if ((col === 'session' || col === 'run') && /^[0-9a-f]{6,}/i.test(c)) return `<td><a class="mono" href="#/session/${encodeURIComponent(c)}">${esc(c)}</a></td>`; if (col === 'project') return `<td title="${esc(c)}">${esc(projLabel(c))}<span class="sub">${esc(tilde(c))}</span></td>`; return `<td class="${i > 1 ? 'r num' : ''}">${esc(c)}</td>`; }).join('')}</tr>`).join('')}
    </tbody></table></div></div>`;
  h += `<p class="note" style="margin-top:14px"><a href="#/findings">All findings</a>${n > 1 ? ` · <a href="#/finding/${esc(rep.findings[n - 2].id)}">Previous</a>` : ''}${n && n < rep.findings.length ? ` · <a href="#/finding/${esc(rep.findings[n].id)}">Next finding</a>` : ''}</p>`;

V.agents = async () => {
  const d = await api('agents', scopeParams());
  const rows = d.agents || [];
  let h = pageHead('Sub-agents', 'Spend per sub-agent type: runs, the model and effort it mostly ran at, average cost per run, the share of runs that only read, errored tool results, and requested-versus-actual model mismatches.', cli(['agents']), d);
  if (S.json) return h;
  if (!rows.length) return h + '<div class="panel empty">No sub-agent runs in this window.</div>';
  const total = rows.reduce((a, r) => a + r.runs * r.avg_usd, 0);
  h += `<div class="panel tbl"><table><thead><tr><th>Agent</th><th class="r">Runs</th><th>Model</th><th>Effort</th><th class="r">Avg cost / run</th><th class="r">${sub ? 'Share of sub-agent spend' : 'Total'}</th><th class="r">Read-only runs</th><th class="r">Tool errors</th><th class="r">Requested ≠ actual</th><th></th></tr></thead><tbody>
    ${rows.map(a => `<tr class="row"><td><b>${esc(a.agent)}</b></td><td class="r num">${int(a.runs)}</td><td class="mono">${esc(a.model)}</td><td>${esc(a.effort) || '<span class="note">-</span>'}</td><td class="r num">${usd(a.avg_usd)}</td><td class="r num">${sub ? pct(total ? a.runs * a.avg_usd / total : 0) : usd(a.runs * a.avg_usd)}</td><td class="r num">${a.read_only_share >= 0.999 && /opus|fable|mythos/.test(a.model) ? '<span class="pill warn">100%</span>' : pct(a.read_only_share)}</td><td class="r num">${a.errors > 20 ? `<span class="pill crit">${int(a.errors)}</span>` : int(a.errors)}</td><td class="r num">${a.mismatched ? `<span class="pill warn">${int(a.mismatched)}</span>` : '0'}</td><td><a href="#/sessions?agent=${encodeURIComponent(a.agent)}" class="note">runs →</a></td></tr>`).join('')}
  </tbody></table></div>
  <p class="note" style="margin-top:10px">A read-only agent on a top-tier model, or a high error count, is what the findings pick up on.</p>`;
  return h;
};

V.sessions = async (_, q) => {

V.session = async (id) => {
  const p = new URLSearchParams(); p.set('id', id); if (S.currency) p.set('currency', S.currency);
  const s = await api('session', p);
  const turns = s.turns || [];
  const children = s.subagents || [];
  let h = pageHead(`Session <span class="mono">${sid(s.id)}</span>`, `${srcLabel(s.source)} · ${esc(projLabel(s.project)) || '<span class="note">no project</span>'} · ${fmtDT(s.started_at)}${s.ended_at ? ' to ' + fmtT(s.ended_at) : ''} · ${int(s.turn_count ?? turns.length)} turns · <b>${usd(s.usd)}</b>${s.agent_type ? ` · <span class="pill accent">${esc(s.agent_type)}</span>${s.parent_session_id ? ` launched from <a class="mono" href="#/session/${encodeURIComponent(s.parent_session_id)}">${sid(s.parent_session_id)}</a>` : ''}` : ''}`, cli(['session', shortId(s.id).split('/')[0]]), s);
  if (S.json) return h;
  if (!turns.length) return h + '<div class="panel empty">No model responses recorded for this session.</div>';
  const tot = k => turns.reduce((a, t) => a + (Number(t[k]) || 0), 0);
  const inputSide = tot('cache_read') + tot('input') + tot('cache_write_1h') + tot('cache_write_5m');
  const notes = turns.filter(t => t.note).length;
  h += `<div class="tiles">
    <div class="tile"><div class="k">Fresh input</div><div class="v">${int(tot('input'))}</div><div class="d">tokens</div></div>
    <div class="tile"><div class="k">Cache reads</div><div class="v">${int(tot('cache_read'))}</div><div class="d">${inputSide ? Math.round(tot('cache_read') / inputSide * 100) : 0}% hit rate this session</div></div>
    <div class="tile"><div class="k">Cache writes</div><div class="v">${int(tot('cache_write_1h') + tot('cache_write_5m'))}</div><div class="d">${int(tot('cache_write_1h'))} at 1h · ${int(tot('cache_write_5m'))} at 5m</div></div>
    <div class="tile"><div class="k">Output</div><div class="v">${int(tot('output'))}</div><div class="d">${int(tot('thinking'))} of it thinking · ${notes} note${notes === 1 ? '' : 's'}</div></div>
  </div>`;
  const hasCtx = turns.some(t => t.context > 0);
  if (hasCtx && turns.length > 1) {
    const W = 900, H = 120, padL = 50, padB = 18; const maxC = Math.max(...turns.map(t => t.context || 0), 1);
    const px = i => padL + (i / (turns.length - 1)) * (W - padL - 10), py = v => H - padB - (v / maxC) * (H - padB - 8);
    const path = turns.map((t, i) => `${i ? 'L' : 'M'}${px(i).toFixed(1)},${py(t.context || 0).toFixed(1)}`).join(' ');
    h += `<div class="section"><h2>Context carried per turn <small>tokens sent before the turn's own input · a drop is a compaction, a red mark a cache rebuild</small></h2>
      <div class="panel chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Context size per turn">
        ${[0, maxC / 2, maxC].map(v => `<line x1="${padL}" x2="${W}" y1="${py(v)}" y2="${py(v)}" stroke="var(--line)"/><text x="${padL - 6}" y="${py(v) + 4}" text-anchor="end" font-size="10" fill="var(--ink-3)" font-family="var(--mono)">${Math.round(v / 1000)}k</text>`).join('')}
        <path d="${path} L${px(turns.length - 1)},${H - padB} L${padL},${H - padB} Z" fill="var(--seq-1)" opacity=".45"/>
        <path d="${path}" fill="none" stroke="var(--seq-4)" stroke-width="2" stroke-linejoin="round"/>
        ${turns.map((t, i) => t.note ? `<circle cx="${px(i)}" cy="${py(t.context || 0)}" r="4.5" fill="${t.note === 'compacted' ? 'var(--warn)' : 'var(--crit)'}" stroke="var(--surface)" stroke-width="2"><title>turn ${t.index}: ${esc(t.note)}</title></circle>` : '').join('')}
        ${turns.map((t, i) => (t.launches || []).length ? `<line x1="${px(i)}" x2="${px(i)}" y1="${py(t.context || 0) - 10}" y2="${H - padB}" stroke="var(--s2)" stroke-dasharray="2 3"/><text x="${px(i) + 4}" y="${py(t.context || 0) - 12}" font-size="10" fill="var(--ink-2)">${esc(t.launches.map(l => l.agent_type).join(', '))}</text>` : '').join('')}
        <text x="${padL}" y="${H - 4}" font-size="10" fill="var(--ink-3)">turn 1</text><text x="${W - 10}" y="${H - 4}" font-size="10" fill="var(--ink-3)" text-anchor="end">turn ${turns.length}</text>
      </svg><div class="legend"><span><i style="background:var(--seq-4)"></i>context tokens</span><span><i style="background:var(--warn);border-radius:50%"></i>compacted</span><span><i style="background:var(--crit);border-radius:50%"></i>cache rebuilt</span><span><i style="background:var(--s2)"></i>sub-agent launched</span></div></div></div>`;
  }
  if (children.length) h += `<div class="section"><h2>Sub-agents launched <small>${children.length}</small></h2><div class="panel tbl"><table><thead><tr><th>Run</th><th>Agent</th><th>Started</th><th class="r">Turns</th><th class="r">Tool calls</th><th class="r">Errors</th><th class="r">Cost</th></tr></thead><tbody>${children.map(c => `<tr class="row clickable" data-href="#/session/${encodeURIComponent(c.id)}"><td><a class="mono" href="#/session/${encodeURIComponent(c.id)}">${sid(c.id)}</a></td><td><span class="pill accent">${esc(c.agent_type)}</span></td><td class="num">${fmtDT(c.started_at)}</td><td class="r num">${int(c.turns)}</td><td class="r num">${int(c.tool_calls)}</td><td class="r num">${int(c.tool_errors)}</td><td class="r num">${usd(c.usd)}</td></tr>`).join('')}</tbody></table></div></div>`;
  h += `<div class="section"><h2>Turn by turn <small>${turns.length} model responses · no prompt text or tool output is stored</small></h2>
    <div class="panel tbl"><table><thead><tr><th class="r">Turn</th><th>Time</th><th>Model</th><th>Effort</th><th class="r">In</th><th class="r">Cached</th><th class="r">Write 5m</th><th class="r">Write 1h</th><th class="r">Out</th><th class="r">Thinking</th><th class="r">Text</th><th class="r">Tools</th><th class="r">Cost</th><th>Note</th></tr></thead><tbody>
    ${turns.map(t => `<tr class="row"><td class="r num">${t.index}</td><td class="num">${fmtT(t.time)}</td><td class="mono">${esc(t.model)}</td><td>${esc(t.effort) || '<span class="note">-</span>'}</td><td class="r num">${int(t.input)}</td><td class="r num">${int(t.cache_read)}</td><td class="r num">${t.cache_write_5m ? int(t.cache_write_5m) : '<span class="note">0</span>'}</td><td class="r num">${t.cache_write_1h ? int(t.cache_write_1h) : '<span class="note">0</span>'}</td><td class="r num">${int(t.output)}</td><td class="r num">${t.thinking ? int(t.thinking) : '<span class="note">0</span>'}</td><td class="r num">${int(t.text_chars)}</td><td class="r num">${t.tool_calls || '<span class="note">0</span>'}</td><td class="r num">${t.known ? usd(t.usd) : '<span class="note" title="no price for this model">unpriced</span>'}</td><td class="turn-note ${t.note === 'cache rebuilt' ? 'rebuild' : ''}">${esc(t.note)}</td></tr>
      ${(t.launches || []).map(l => `<tr class="subagent-line"><td></td><td colspan="13">↳ sub-agent <b>${esc(l.agent_type)}</b> asked <code>${esc(l.requested_model) || 'inherit'}</code>, ran <code>${esc(l.resolved_model) || '?'}</code>${l.agent_id ? ` · <a href="#/session/${encodeURIComponent(s.id + '/agent-' + l.agent_id)}">open run</a>` : ''}</td></tr>`).join('')}`).join('')}
    </tbody></table></div></div>`;
  return h;
};

V.changes = async () => {
  const p = scopeParams(); p.set('min_runs', String(S.minRuns)); if (S.undecided) p.set('include_undecided', '1');
  const d = await api('changes', p);
  const rows = d.changes || [];
  let h = pageHead('Model changes', 'Every point where a sub-agent type\'s model changed, with the real runs before and after compared. Measured, not estimated: both sides are runs that happened.', cli(['changes', ...(S.undecided ? ['--all'] : []), ...(S.minRuns !== 3 ? ['--min-runs ' + S.minRuns] : [])]), d);
  if (S.json) return h;
  h += `<div class="toolbar"><label>Runs needed on each side <input type="number" min="1" id="minruns" value="${S.minRuns}"></label><label><input type="checkbox" id="undecided" ${S.undecided ? 'checked' : ''}> Include changes too early to judge (${int(d.undecided)})</label></div>`;
  if (!rows.length) h += `<div class="panel empty">${d.undecided ? `${int(d.undecided)} model change${d.undecided > 1 ? 's' : ''} in this window, none with enough runs on both sides to judge yet.` : 'No model changes in this window with enough runs to judge. Change an agent\'s model and the next report will tell you whether it helped.'}</div>`;
  else {
    const vp = v => v === 'keep' ? '<span class="pill good">keep</span>' : v === 'revert' ? '<span class="pill crit">revert</span>' : v === 'watch' ? '<span class="pill warn">watch</span>' : '<span class="pill">too early</span>';
    const er = x => x < 0.01 && x > 0 ? '<1' : Math.round(x * 100);
    h += `<div class="grid cols-2">${rows.map(c => `<div class="change">
      <div class="head"><span><b>${esc(c.agent)}</b> <span class="arrow">·</span> ${esc(c.from)} <span class="arrow">→</span> ${esc(c.to)} <span class="arrow">· ${fmtDate(c.at)}</span></span>${vp(c.verdict)}</div>
      <div class="sides"><span></span><span class="h">Runs</span><span class="h">Cost / run</span><span class="h">Tool calls failed</span><span class="h">Turns / run</span>
        <span class="h" style="align-self:center">Before</span><span class="num">${int(c.before.runs)}</span><span class="num">${usd(c.before.avg_usd)}</span><span class="num">${er(c.before.error_rate)}%</span><span class="num">${Math.round(c.before.avg_turns)}</span>
        <span class="h" style="align-self:center">After</span><span class="num">${int(c.after.runs)}</span><span class="num">${usd(c.after.avg_usd)}</span><span class="num">${er(c.after.error_rate)}%</span><span class="num">${Math.round(c.after.avg_turns)}</span></div>
    </div>`).join('')}</div>`;
    if (!S.undecided && d.undecided) h += `<p class="note" style="margin-top:14px">${int(d.undecided)} more change${d.undecided > 1 ? 's' : ''} had too few runs on one side to judge. Tick the box above to see them.</p>`;
  }
  return [h, () => {
    document.getElementById('minruns').onchange = e => { S.minRuns = Math.max(1, +e.target.value || 1); render(); };
    document.getElementById('undecided').onchange = e => { S.undecided = e.target.checked; render(); };
  }];
};

/* ---- router ---- */
function route() {
  const hash = location.hash.replace(/^#\/?/, '') || 'report';
  const [path, qs] = hash.split('?'); const i = path.indexOf('/');
  return { name: i > -1 ? path.slice(0, i) : path, arg: i > -1 ? decodeURIComponent(path.slice(i + 1)) : '', q: new URLSearchParams(qs || '') };
}
async function render() {
  const r = route(); const my = ++seq;
  renderScope();
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('active', a.dataset.route === r.name || (r.name === 'finding' && a.dataset.route === 'findings') || (r.name === 'session' && a.dataset.route === 'sessions')));
  const view = document.getElementById('view');
  const fn = V[r.name] || V.report;
  view.setAttribute('aria-busy', 'true');
  const t = setTimeout(() => { if (my === seq) view.innerHTML = '<p class="note">Loading…</p>'; }, 150);
  let out, after;
  try { const res = await fn(r.arg, r.q); if (Array.isArray(res)) [out, after] = res; else out = res; }
  catch (e) { out = `<div class="page-head"><div><h1>${esc(r.name)}</h1></div></div><div class="banner crit">${esc(e.message)}</div>${e.status ? '' : '<p class="note">The tallybook server may have stopped. Start it again with <code>tallybook --serve</code> and reload.</p>'}`; }
  clearTimeout(t);
  if (my !== seq) return;
  view.innerHTML = out; view.removeAttribute('aria-busy');
  const ft = document.getElementById('fresh-text'); if (ft) ft.innerHTML = freshText();
  if (after) after();
  view.querySelectorAll('tr[data-href]').forEach(tr => tr.addEventListener('click', e => { if (e.target.closest('a')) return; location.hash = tr.dataset.href; }));
  window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const c = e.target.closest('[data-copy]'); if (c) { try { navigator.clipboard.writeText(c.dataset.copy); toast('Copied'); } catch (err) { toast('Copy failed'); } }
  if (e.target.id === 'json-toggle') { S.json = !S.json; render(); }
});
let toastT; function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200); }
addEventListener('hashchange', render);

(async function boot() {
  let stored = null; try { stored = localStorage.getItem('tb-theme'); } catch (e) {}
  setTheme(stored || 'embigo');
  document.getElementById('brand-host').textContent = location.host;
  try {
    const st = await api('status');
    defaults = { since: st.default_since || '30d', plan: st.plan || '' };
    S.home = st.home || '';
    projects = st.projects || [];
  } catch (e) { /* the report will show the error */ }
  render();
})();
</script>
