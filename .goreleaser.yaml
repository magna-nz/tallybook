version: 2

project_name: tallybook

before:
  hooks:
    - go mod tidy

builds:
  - id: tallybook
    main: ./cmd/tallybook
    binary: tallybook
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"

release:
  github:
    owner: magna-nz
    name: tallybook

homebrew_casks:
  - name: tallybook
    repository:
      owner: magna-nz
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/magna-nz/tallybook
    description: A local ledger for what your coding agents cost, and what you could have paid instead
    license: MIT
    binaries: [tallybook]
